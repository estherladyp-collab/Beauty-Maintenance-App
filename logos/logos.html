<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ece0;--ink:#2a1b16;--gold:#b48a4c;--gold2:#d9b878;--gold3:#8d6a3a}
body{margin:0;background:#e9dfd1;font-family:"Hanken Grotesk",sans-serif;padding:40px;width:1720px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:var(--cream);border-radius:28px;padding:34px 20px 30px;display:grid;justify-items:center;gap:26px}
.card h4{margin:0;font:500 13px "Hanken Grotesk";letter-spacing:.2em;text-transform:uppercase;color:#85622f;align-self:start;justify-self:start;margin-left:14px}
.logo svg{display:block}
.icons{display:flex;gap:18px;align-items:center}
.icons svg{display:block;border-radius:22%;box-shadow:0 8px 20px -10px rgba(42,27,22,.5)}
</style></head><body><div class="board">

<!-- A -->
<div class="card"><h4>A · Monogram</h4>
<div class="logo" id="logoA"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
<defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b878"/><stop offset=".5" stop-color="#b48a4c"/><stop offset="1" stop-color="#8d6a3a"/></linearGradient></defs>
<circle cx="260" cy="150" r="112" fill="none" stroke="url(#gA)" stroke-width="2.5"/>
<circle cx="260" cy="150" r="100" fill="none" stroke="url(#gA)" stroke-width=".9"/>
<text x="260" y="186" text-anchor="middle" font-family="Bodoni Moda" font-size="112" fill="#2a1b16" letter-spacing="-4">M<tspan fill="url(#gA)">Y</tspan></text>
<text x="260" y="336" text-anchor="middle" font-family="Hanken Grotesk" font-weight="500" font-size="21" fill="#2a1b16" letter-spacing="9">MAINTAINING YOU</text>
<line x1="150" y1="366" x2="238" y2="366" stroke="#b48a4c" stroke-width="1.2"/><line x1="282" y1="366" x2="370" y2="366" stroke="#b48a4c" stroke-width="1.2"/>
<path d="M260 358l6 8-6 8-6-8z" fill="url(#gA)"/>
</svg></div>
<div class="icons" id="iconsA">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><rect width="120" height="120" fill="#2a1b16"/><circle cx="60" cy="60" r="44" fill="none" stroke="#d9b878" stroke-width="2"/><text x="60" y="76" text-anchor="middle" font-family="Bodoni Moda" font-size="48" fill="#f4ece0" letter-spacing="-2">M<tspan fill="#d9b878">Y</tspan></text></svg>
</div></div>

<!-- B -->

</div></div>
